tencentcloud-asr:
  secret_id: "${TENCENT_SECRET_ID}"
  secret_key: "${TENCENT_SECRET_KEY}"
  app_id: "${TENCENT_APP_ID}"
  project_id: 0

server:
  host: "0.0.0.0"
  port: 5000
  debug: true

audio:
  sample_rate: 16000
  channels: 1
  format: "wav"
  codec: "pcm"

input_method:
  default_delay: 0.05
  punctuation_delay: 0.15
  auto_space: true

ui:
  title: "语音输入法"
  theme: "light"
  show_waveform: true
